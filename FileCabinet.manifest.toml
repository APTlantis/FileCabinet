maintainer = "Herb"

[paths]
root = "D:\\DRS\\FileCabinet"

[metadata]
created = "2026-05-23"
last_updated = "2026-08-04"
maintainer = "APTlantis"
license = "Unspecified"
language_primary = "VB.NET"
languages_used = [
  "VB.NET",
  "XAML",
  "PowerShell",
  "Markdown",
  "JSON",
