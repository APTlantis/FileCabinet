[paths]
root = "D:\\DRS\\File Cabinet"

[metadata]
created = "2026-05-23"
last_updated = "2026-08-17"
maintainer = "APTlantis"
license = "Unspecified"
language_primary = "VB.NET"
languages_used = [
  "VB.NET",
  "XAML",
  "PowerShell",
  "Markdown",
  "JSON",
  "TOML"
]

[runtime]
platform = "desktop"
environment = "Windows x64, self-contained .NET 10 WPF application"
services = []
storage = [
  "Local filesystem vault",
  "AppData catalog",
  "Vault items folder",
  "Vault thumbnails folder",
  "Vault extracted-text folder",
  "Vault exports folder",
  "Vault quarantine folder",
  "Vault repair log",
