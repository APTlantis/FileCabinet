  "Blake3 2.2.1",
  "StreamHash 1.11.3",
  "System.IO.Hashing 10.0.5",
  "MSTest"
]

[artifacts]
produces = [
  "artifacts/installer/FileCabinet-0.1.0.0-win-x64.msi",
  "artifacts/historical/pre-standard-v1x/FileCabinet-1.7.3.0-win-x64.msi",
